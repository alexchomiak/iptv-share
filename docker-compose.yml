services:
  iptv-share:
    build: .
    container_name: iptv-share
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_USERNAME: admin
      APP_PASSWORD: admin
      SESSION_SECRET: x
      DATABASE_PATH: /data/app.sqlite
      M3U_URL: http://192.168.0.37:9191/output/m3u
      EPG_URL: http://192.168.0.37:9191/output/epg
      PUBLIC_BASE_URL: http://localhost:8080
      SHARE_AUTO_DELETE_SECONDS: 300
      TRANSCODE_MPEGTS: "true"
      FFMPEG_HWACCEL: none
      FFMPEG_VAAPI_DEVICE: /dev/dri/renderD128
      ESPN_SEARCH_CACHE_SECONDS: 21600
      ESPN_LIVE_CACHE_SECONDS: 60
      ESPN_LIVE_CACHE_SECONDS_NFL: 60
      ESPN_SUMMARY_CACHE_SECONDS_MLB: 180
      ESPN_LIVE_CACHE_SECONDS_NBA: 60
      ESPN_LIVE_CACHE_SECONDS_NCAAFB: 60
      ESPN_LIVE_CACHE_SECONDS_NCAAMB: 60
      ESPN_MAX_REQUESTS_PER_DAY: 1000000
    volumes:
      - ./data:/data
    restart: unless-stopped
